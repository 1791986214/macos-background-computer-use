name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-unit-test:
    # 必须 macOS runner：源码依赖 AppKit / ScreenCaptureKit / ApplicationServices
    #
    # 用 macos-latest 而不是固定小版本：固定标签会随镜像退役而「无人接单」，
    # 表现为 job 在 1 秒内被 cancel、runner_name 为空、steps 为空 —— 那不是在报错，
    # 是根本没有机器跑。遇到过就把标签升到当时仍受支持的版本。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          uname -m
          xcode-select -p
          swift --version || true
          xcrun --show-sdk-path

      - name: 构建
        run: ./scripts/build.sh

      - name: 版本与帮助可用
        run: |
          ./bin/wbcu version
          ./bin/wbcu --help > /dev/null

      - name: 单元测试（纯逻辑，无需 TCC 授权）
        run: ./tests/run-all.sh unit

      - name: 技能与引擎一致性（doctor 必须为「一致」）
        # 共享 SKILL.md 里写错平台命令（例如 macOS 没有顶层 capture）会在这里红，
        # 避免每轮同步都要靠人肉发现。
        run: ./bin/wbcu doctor

      - name: 发布哈希一致性（文档 vs npm 登记）
        # 手写的 SHA256 一定会腐烂：v0.6.2 的安装文档曾挂着 v0.6.0 的哈希。
        run: ./scripts/check-release-hashes.sh

      - name: 自检报告（JSON）
        if: always()
        run: ./bin/wbcu selftest --json > selftest.json || true

      - name: 源码卫生（个人路径 / 密钥 / 私有 API）
        run: |
          set -e
          if grep -rEn "/Users/[a-z]+/" src mcp 2>/dev/null | grep -v example; then
            echo "::error::源码含个人绝对路径"; exit 1
          fi
          if grep -rEn "SLPS[A-Za-z]+|SLS[A-Za-z]+" src 2>/dev/null; then
            echo "::error::使用了 SkyLight 私有 API"; exit 1
          fi
          echo "OK"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wbcu-binary
          path: |
            bin/wbcu
            selftest.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Windows 引擎：编译 + 纯逻辑单元测试（真机 GUI 验收不在这里跑，见下）
  # ---------------------------------------------------------------------------
  windows-build-and-unit-test:
    # windows-latest 的意义在于「真实 Windows SDK + 真实 runtime 上能编译」，
    # 而不是「能点得动按钮」——后者见 gui-acceptance-note。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 环境信息
        shell: pwsh
        run: |
          dotnet --info
          [System.Environment]::OSVersion.Version
          $env:PROCESSOR_ARCHITECTURE

      - name: 构建（含 WinRT / UIA COM / D3D11 目标）
        shell: pwsh
        run: dotnet build src-windows/Wbcu.sln -c Release -nologo

      - name: 单元测试（跨平台契约逻辑，不需要桌面）
        shell: pwsh
        run: dotnet test src-windows/Wbcu.Tests/Wbcu.Tests.csproj -c Release --nologo

      - name: 发布 win-x64
        shell: pwsh
        run: |
          dotnet publish src-windows/Wbcu.Windows/Wbcu.Windows.csproj -c Release -r win-x64 `
            --self-contained false -o dist/win-x64 --nologo

      - name: 引擎自检（信息性）
        # 故意不设为阻塞：runner 的会话不保证是交互式桌面，
        # UIA 的语义调用在无桌面会话下可能不可用。自检里的 uia.init 已对
        # 非交互式会话做「跳过」处理，但其余检查仍可能受环境影响。
        # 用自检结果冒充「功能可用」是明确禁止的。
        continue-on-error: true
        shell: pwsh
        run: |
          .\dist\win-x64\wbcu.exe version
          .\dist\win-x64\wbcu.exe selftest --json | Tee-Object -FilePath selftest-windows.json
          .\dist\win-x64\wbcu.exe capabilities --json | Tee-Object -FilePath capabilities-windows.json

      - name: 源码卫生（个人路径 / 密钥）
        shell: pwsh
        run: |
          $bad = Select-String -Path src-windows/**/*.cs -Pattern 'C:\\Users\\[A-Za-z]+' -ErrorAction SilentlyContinue
          if ($bad) { Write-Error "源码含个人绝对路径"; exit 1 }
          Write-Host "OK"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wbcu-windows
          path: |
            dist/win-x64/**
            selftest-windows.json
            capabilities-windows.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 真实 Computer Use 集成测试 **不在本 workflow 里跑**。
  #
  # 原因：这类测试需要
  #   1) 一个有图形会话的 macOS 机器（runner 是无头/无登录会话）
  #   2) 用户在系统设置里手动授予 辅助功能 + 屏幕录制
  #   3) 期间没有其他人操作鼠标（否则「零位移」断言不可靠）
  #
  # 这三条在托管 runner 上都不成立。把它塞进 CI 只会得到两种结果：
  # 永远 skip（假绿），或者永远 fail（噪音）。
  #
  # 正确做法：在授权过的自托管机器上手动/定时跑
  #   ./tests/run-all.sh all
  # 结论：**CI 绿 ≠ 功能可用**，请勿据此宣称能力已验证。
  # ---------------------------------------------------------------------------
  integration-note:
    runs-on: ubuntu-latest
    steps:
      - name: 说明
        run: |
          echo "集成测试需要真实桌面会话与 TCC 授权，请在授权机器上运行："
          echo "  ./tests/run-all.sh all"

  gui-acceptance-note:
    runs-on: ubuntu-latest
    steps:
      - name: 说明
        run: |
          echo "Windows GUI 验收（wbcu-guitests.exe）必须在有交互桌面的 Windows 上手动运行："
          echo "  dist/win-x64/testapps/wbcu-guitests.exe --wbcu dist/win-x64/wbcu.exe"
          echo "托管 runner 上的 GUI 结果不能当作真实交互验证。"
